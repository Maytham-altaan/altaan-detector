# Deploys the Vite build to GitHub Pages on every push to `main`.
#
# IMPORTANT CAVEAT: GitHub Pages can ONLY serve the static frontend.
# The `api/` Vercel Functions will NOT run here, so anything that calls
# /api/* (AI Rewrite, Sign in, Upgrade, etc.) will show a network error.
# That's fine for previewing the detector + rule-based humanizer.
# For the full stack, deploy to Vercel instead.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Avoid running two deploys at once
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Build (GitHub Pages base path)
        run: npm run build
        env:
          GITHUB_PAGES: "true"

      - name: SPA fallback (so /admin doesn't 404 on GH Pages)
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
